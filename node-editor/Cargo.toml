[package]
name = "agg-gui-node-editor"
version = "0.0.3"
edition = "2021"
# agg-rust (a path dependency) requires 1.88; wgpu 29 needs 1.87 and arboard 3.6 needs 1.71.
rust-version = "1.88"
license = "MIT"
description = "A reusable, model-agnostic node-graph editor widget for agg-gui."
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
repository = "https://github.com/larsbrubaker/agg-gui"
readme = "README.md"
keywords = ["agg-gui", "node-graph", "visual-programming", "editor", "widget"]
categories = ["gui"]

[lib]
name = "agg_gui_node_editor"
path = "src/lib.rs"

[features]
default = ["reflect"]
# Forwards to agg-gui's `reflect` feature. The node editor itself has no
# reflection code; agg-gui is depended on with its default features off so a
# consumer that turns this crate's defaults off (a web build keeping its wasm
# small, say) can leave `bevy_reflect` out, and one that keeps them gets a
# single, consistently-featured agg-gui in the dependency graph.
reflect = ["agg-gui/reflect"]

[dependencies]
# Default features off so they stay the consumer's choice (see `reflect`
# above); the node editor needs none of agg-gui's optional features.
agg-gui = { path = "../agg-gui", default-features = false }
web-time = "1"
