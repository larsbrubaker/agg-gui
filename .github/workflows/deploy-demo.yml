name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Checks agg-gui out into `agg-gui/` with its path-dependency siblings
  # (agg-rust, tess2-rust) next to it, as ci.yml does.
  build:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: agg-gui
    steps:
      - name: Checkout agg-gui
        uses: actions/checkout@v7
        with:
          path: agg-gui

      - name: Checkout agg-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/agg-rust
          path: agg-rust

      - name: Checkout tess2-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/tess2-rust
          path: tess2-rust

      - name: Checkout SVG test fixtures
        run: git submodule update --init tests/resvg-test-suite

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install demo dependencies
        run: cd demo && bun install

      - name: Build WASM
        run: wasm-pack build demo-wasm --target web --out-dir ../demo/public/pkg --no-typescript

      - name: Bundle TypeScript
        run: cd demo && bun run build

      - name: Upload built site as artifact
        uses: actions/upload-artifact@v7
        with:
          name: demo-dist
          path: agg-gui/demo/dist
          retention-days: 1

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: agg-gui/demo/dist

  # Browser smoke test — boots the built WASM demo in headless Chrome and
  # asserts a real, non-blank canvas paints (screenshot) plus that desktop
  # typing and the Ctrl+C system-clipboard chord work (keyboard).  Deploy is
  # gated on this so a broken WASM build (panic on init, blank canvas,
  # font-load failure, shader regression) or an input regression (dead editors,
  # broken clipboard chords) cannot ship to GitHub Pages.
  test:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install demo dependencies
        run: cd demo && bun install

      # `playwright.config.ts` uses `channel: "chrome"`.  ubuntu-26.04 ships
      # Google Chrome pre-installed, so we only need Playwright's CLI
      # dependencies (no separate browser download).
      - name: Install Playwright dependencies
        run: cd demo && bunx playwright install-deps chrome

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: demo-dist
          # The dev server (bun run dev) reads from demo/public, so place
          # the pre-built WASM + bundle.js there for the test webServer.
          path: demo/dist

      - name: Stage built site for dev server
        run: |
          mkdir -p demo/public/pkg demo/public/dist
          cp -r demo/dist/public/pkg/. demo/public/pkg/
          cp -r demo/dist/public/dist/. demo/public/dist/

      - name: Run browser tests
        run: cd demo && bunx playwright test screenshot keyboard

      - name: Upload screenshot artifact on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-screenshot
          path: demo/tests/snapshots/

  deploy:
    needs: test
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
