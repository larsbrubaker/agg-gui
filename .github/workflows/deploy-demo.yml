name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Checks agg-gui out into `agg-gui/` with its path-dependency siblings
  # (agg-rust, tess2-rust, whistle-rust) next to it, as ci.yml does.
  build:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: agg-gui
    steps:
      - name: Checkout agg-gui
        uses: actions/checkout@v7
        with:
          path: agg-gui

      - name: Checkout agg-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/agg-rust
          path: agg-rust

      - name: Checkout tess2-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/tess2-rust
          path: tess2-rust

      - name: Checkout whistle-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/whistle-rust
          path: whistle-rust

      - name: Checkout SVG test fixtures
        run: git submodule update --init tests/resvg-test-suite

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install demo dependencies
        run: cd demo && bun install

      # The on-screen keyboard's dictation model, served from the site itself
      # (public/whistle/whistle.cact); demo/build-whistle.sh copies it.
      # The Whistle model (16.9 MB), cached under its pinned SHA-256
      # (whistle-rust/scripts/weights.sha256). On a miss it is fetched from
      # whistle-rust's GitHub Pages copy, falling back to Hugging Face;
      # fetch-weights.sh checks the SHA-256 of whatever is there (a cached or
      # Pages copy) and downloads from Hugging Face only when the file is
      # missing, so a bad copy is deleted and fetched again from there.
      - name: Model checksum
        id: model-sha
        run: echo "sha=$(awk '$2 == "models/whistle.cact" { print $1 }' ../whistle-rust/scripts/weights.sha256)" >> "$GITHUB_OUTPUT"

      - name: Cache the Whistle model
        uses: actions/cache@v6
        with:
          path: whistle-rust/models/whistle.cact
          key: whistle-cact-${{ steps.model-sha.outputs.sha }}

      - name: Fetch the Whistle model
        run: |
          model=../whistle-rust/models/whistle.cact
          if [ ! -f "$model" ]; then
            mkdir -p "$(dirname "$model")"
            curl -sSfL https://larsbrubaker.github.io/whistle-rust/whistle.cact -o "$model" || rm -f "$model"
          fi
          ../whistle-rust/scripts/fetch-weights.sh || { rm -f "$model"; ../whistle-rust/scripts/fetch-weights.sh; }

      # The UI module and the dictation worker module (simd128).
      - name: Build WASM
        run: demo/build-wasm.sh

      - name: Bundle TypeScript
        run: cd demo && bun run build

      - name: Upload built site as artifact
        uses: actions/upload-artifact@v7
        with:
          name: demo-dist
          path: agg-gui/demo/dist
          retention-days: 1

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: agg-gui/demo/dist

  # Browser smoke test — boots the built WASM demo in headless Chrome and
  # asserts a real, non-blank canvas paints (screenshot) plus that desktop
  # typing and the Ctrl+C system-clipboard chord work (keyboard), and that
  # the on-screen keyboard's microphone dictates a whistle-rust test clip
  # into a field, downloads the model with progress, retries a failed
  # download and reports a denied microphone (dictation*).  Deploy is
  # gated on this so a broken WASM build (panic on init, blank canvas,
  # font-load failure, shader regression) or an input regression (dead editors,
  # broken clipboard chords) cannot ship to GitHub Pages.
  test:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # The speech clip the dictation test plays as the microphone.
      - name: Checkout whistle-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/whistle-rust
          path: whistle-rust
          sparse-checkout: test-data/clips

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install demo dependencies
        run: cd demo && bun install

      # `playwright.config.ts` uses `channel: "chrome"`.  ubuntu-26.04 ships
      # Google Chrome pre-installed, so we only need Playwright's CLI
      # dependencies (no separate browser download).
      - name: Install Playwright dependencies
        run: cd demo && bunx playwright install-deps chrome

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: demo-dist
          # The dev server (bun run dev) reads from demo/public, so place
          # the pre-built WASM + bundle.js there for the test webServer.
          path: demo/dist

      - name: Stage built site for dev server
        run: |
          mkdir -p demo/public/pkg demo/public/dist demo/public/whistle
          cp -r demo/dist/public/pkg/. demo/public/pkg/
          cp -r demo/dist/public/dist/. demo/public/dist/
          cp -r demo/dist/public/whistle/. demo/public/whistle/

      - name: Run browser tests
        env:
          DICTATION_CLIP: ${{ github.workspace }}/whistle-rust/test-data/clips/en_samantha.wav
        run: cd demo && bunx playwright test screenshot keyboard dictation

      - name: Upload screenshot artifact on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-screenshot
          path: demo/tests/snapshots/

  deploy:
    needs: test
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
