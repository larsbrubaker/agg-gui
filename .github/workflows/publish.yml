# Publishes a workspace crate to crates.io from GitHub's network.
#
# Exists because the development machine's network path drops HTTPS uploads
# larger than ~1.1MB (transparent middlebox; crates.io itself is fine), so
# `cargo publish` from that box fails on any non-trivial crate.
#
# Requires the repository secret CARGO_REGISTRY_TOKEN (a crates.io token
# with publish-new and publish-update scopes).
#
# agg-rust and tess2-rust are `{ version, path }` dependencies.
# Cargo needs the sibling checkouts to load the workspace, so they are checked
# out next to agg-gui as in ci.yml; the published manifest keeps only the
# `version`, and cargo's verify build resolves those crates from crates.io.
# So whenever agg-gui needs a newer agg-rust (or tess2-rust),
# publish that crate first, then raise the `version` requirement in the
# member Cargo.toml files to the new release.
name: publish

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Workspace crate to publish (package name)"
        required: true
        default: "agg-gui"

jobs:
  publish:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: agg-gui
    steps:
      - name: Checkout agg-gui
        uses: actions/checkout@v7
        with:
          path: agg-gui

      - name: Checkout agg-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/agg-rust
          path: agg-rust

      - name: Checkout tess2-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/tess2-rust
          path: tess2-rust
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p "${{ github.event.inputs.crate }}"
