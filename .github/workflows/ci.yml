name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout SVG test fixtures
        run: git submodule update --init tests/resvg-test-suite

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Build library
        run: cargo build -p agg-gui

      - name: Run tests
        run: cargo test -p agg-gui

      # The wgpu renderer and the shells on top of it. The headless GPU
      # read-back tests in these crates skip themselves when no adapter is
      # available, which is the case on a stock runner, so this covers the
      # CPU-side logic (clip math, cache decisions, capture geometry, the
      # surface-acquire policy) without needing a GPU.
      - name: Build wgpu renderer
        run: cargo build -p agg-gui-wgpu

      - name: Run wgpu renderer + shell tests
        run: cargo test -p agg-gui-wgpu -p demo-wgpu

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout SVG test fixtures
        run: git submodule update --init tests/resvg-test-suite

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build demo-wasm --target web --out-dir ../demo/public/pkg --no-typescript
