# agg-rust and tess2-rust are `{ version, path }` dependencies
# on sibling checkouts (`../../agg-rust` from each crate), and agg-gui-whistle
# a path dependency on whistle-rust's. Every job that runs cargo therefore
# checks agg-gui out into `agg-gui/` and the siblings next to it, matching a
# dev machine's `rust-apps/` layout, and runs from `agg-gui/`.
# The siblings are public repos, so the default token covers every checkout.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # fmt and clippy run on the toolchain pinned in rust-toolchain.toml, so a
  # newer stable's lints never fail CI unannounced. clippy covers every
  # workspace target (tests and demos included); the SVG fixtures are needed
  # because demo-ui embeds sample files from them at compile time.
  lint:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: agg-gui
    steps:
      - name: Checkout agg-gui
        uses: actions/checkout@v7
        with:
          path: agg-gui

      - name: Checkout agg-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/agg-rust
          path: agg-rust

      - name: Checkout tess2-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/tess2-rust
          path: tess2-rust

      - name: Checkout whistle-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/whistle-rust
          path: whistle-rust

      - name: Checkout SVG test fixtures
        run: git submodule update --init tests/resvg-test-suite

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agg-gui/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('agg-gui/**/Cargo.toml', 'agg-gui/rust-toolchain.toml') }}

      # Not `--all`: that also formats local path dependencies, i.e. the
      # sibling checkouts. In this virtual workspace plain `cargo fmt` covers
      # exactly our members.
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # agg-gui-whistle's native microphone (agg-mic: the PulseAudio protocol
      # here, pure Rust, so no system headers) and download features, which
      # no workspace member turns on.
      - name: Clippy (agg-gui-whistle, native features)
        run: cargo clippy -p agg-gui-whistle --all-targets --features native-mic,native-download -- -D warnings

      # Its browser halves: the provider in the UI module, and the worker
      # module, built with simd128 as demo/build-whistle.sh builds it.
      - name: Clippy (agg-gui-whistle, wasm)
        run: |
          cargo clippy -p agg-gui-whistle --target wasm32-unknown-unknown -- -D warnings
          RUSTFLAGS="-C target-feature=+simd128" CARGO_TARGET_DIR=target/wasm-simd128 \
            cargo clippy -p agg-gui-whistle-worker --target wasm32-unknown-unknown -- -D warnings

  test:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: agg-gui
    steps:
      - name: Checkout agg-gui
        uses: actions/checkout@v7
        with:
          path: agg-gui

      - name: Checkout agg-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/agg-rust
          path: agg-rust

      - name: Checkout tess2-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/tess2-rust
          path: tess2-rust

      - name: Checkout whistle-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/whistle-rust
          path: whistle-rust

      - name: Checkout SVG test fixtures
        run: git submodule update --init tests/resvg-test-suite

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agg-gui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('agg-gui/**/Cargo.toml') }}

      - name: Build library
        run: cargo build -p agg-gui

      - name: Run tests
        run: cargo test -p agg-gui

      # The `clipboard` feature's arboard backend (the X11 / Wayland path
      # here) is otherwise never compiled: the tests above build agg-gui
      # without it.
      - name: Check clipboard feature
        run: cargo check -p agg-gui --features clipboard

      # The wgpu renderer and the shells on top of it. The headless GPU
      # read-back tests in these crates skip themselves when no adapter is
      # available, which is the case on a stock runner, so this covers the
      # CPU-side logic (clip math, cache decisions, capture geometry, the
      # surface-acquire policy) without needing a GPU.
      - name: Build wgpu renderer
        run: cargo build -p agg-gui-wgpu

      - name: Build native shell
        run: cargo build -p agg-gui-shell

      - name: Run wgpu renderer + shell tests
        run: cargo test -p agg-gui-wgpu -p agg-gui-shell -p demo-wgpu

      # The model lets agg-gui-whistle's engine and native tests run on real
      # speech instead of skipping.
      # The Whistle model (16.9 MB), cached under its pinned SHA-256
      # (whistle-rust/scripts/weights.sha256). On a miss it is fetched from
      # whistle-rust's GitHub Pages copy, falling back to Hugging Face;
      # fetch-weights.sh checks the SHA-256 of whatever is there (a cached or
      # Pages copy) and downloads from Hugging Face only when the file is
      # missing, so a bad copy is deleted and fetched again from there.
      - name: Model checksum
        id: model-sha
        run: echo "sha=$(awk '$2 == "models/whistle.cact" { print $1 }' ../whistle-rust/scripts/weights.sha256)" >> "$GITHUB_OUTPUT"

      - name: Cache the Whistle model
        uses: actions/cache@v6
        with:
          path: whistle-rust/models/whistle.cact
          key: whistle-cact-${{ steps.model-sha.outputs.sha }}

      - name: Fetch the Whistle model
        run: |
          model=../whistle-rust/models/whistle.cact
          if [ ! -f "$model" ]; then
            mkdir -p "$(dirname "$model")"
            curl -sSfL https://larsbrubaker.github.io/whistle-rust/whistle.cact -o "$model" || rm -f "$model"
          fi
          ../whistle-rust/scripts/fetch-weights.sh || { rm -f "$model"; ../whistle-rust/scripts/fetch-weights.sh; }

      # The microphone crate's plumbing, over a fake device (the live
      # recording test is ignored: a runner has no microphone).
      - name: Run microphone tests
        run: cargo test -p agg-mic

      - name: Run dictation tests
        run: cargo test -p agg-gui-whistle --features native-mic,native-download

  # The clipboard feature's per-platform code (`clipboard::has_image` asks the
  # Windows and macOS clipboards for a picture format directly). A check, not
  # a test run, to keep these runners cheap.
  check-clipboard:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agg-gui
    steps:
      - name: Checkout agg-gui
        uses: actions/checkout@v7
        with:
          path: agg-gui

      - name: Checkout agg-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/agg-rust
          path: agg-rust

      - name: Checkout tess2-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/tess2-rust
          path: tess2-rust

      - name: Checkout whistle-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/whistle-rust
          path: whistle-rust

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agg-gui/target
          key: ${{ runner.os }}-cargo-clipboard-${{ hashFiles('agg-gui/**/Cargo.toml') }}

      - name: Check clipboard feature
        run: cargo check -p agg-gui --features clipboard

      # agg-gui-whistle's microphone on agg-mic's AVAudioEngine and WASAPI
      # captures, and agg-mic's own tests there (the live recording is
      # ignored: a runner has no microphone).
      - name: Check native dictation
        run: cargo check -p agg-gui-whistle --features native-mic,native-download

      - name: Run microphone tests
        run: cargo test -p agg-mic

  build-wasm:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: agg-gui
    steps:
      - name: Checkout agg-gui
        uses: actions/checkout@v7
        with:
          path: agg-gui

      - name: Checkout agg-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/agg-rust
          path: agg-rust

      - name: Checkout tess2-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/tess2-rust
          path: tess2-rust

      - name: Checkout whistle-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/whistle-rust
          path: whistle-rust

      - name: Checkout SVG test fixtures
        run: git submodule update --init tests/resvg-test-suite

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # The UI module and the dictation worker module (simd128).
      - name: Build WASM
        run: demo/build-wasm.sh
