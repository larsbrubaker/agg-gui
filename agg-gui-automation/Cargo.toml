# GUI automation for agg-gui: the port of agg-sharp's GuiAutomation
# (AutomationRunner and friends). A test-only crate: consumers take it as a
# dev-dependency. Design and remaining slices: docs/design/gui-automation.md.
[package]
name = "agg-gui-automation"
version = "0.1.0"
edition = "2021"
# agg-rust (a path dependency) requires 1.88; wgpu 29 needs 1.87 and arboard 3.6 needs 1.71.
rust-version = "1.88"
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
license = "MIT"
description = "GUI test automation for agg-gui: headless driver, widget handles, typed-key parsing, search regions and waits (a port of agg-sharp's GuiAutomation)"
repository = "https://github.com/larsbrubaker/agg-gui"
publish = false

[dependencies]
agg-gui = { path = "../agg-gui" }
# Decodes image needles loaded by file name (`image_source.rs`); the same
# version and features agg-gui already builds, so nothing new is compiled.
image = "0.24"
