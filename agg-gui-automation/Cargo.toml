# GUI automation for agg-gui: the port of agg-sharp's GuiAutomation
# (AutomationRunner and friends). A test-only crate: consumers take it as a
# dev-dependency. Design and remaining slices: docs/design/gui-automation.md.
[package]
name = "agg-gui-automation"
version = "0.1.0"
edition = "2021"
# agg-rust (a path dependency) requires 1.88; wgpu 29 needs 1.87 and arboard 3.6 needs 1.71.
rust-version = "1.88"
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
license = "MIT"
description = "GUI test automation for agg-gui: headless driver, widget handles, typed-key parsing, search regions and waits (a port of agg-sharp's GuiAutomation)"
repository = "https://github.com/larsbrubaker/agg-gui"
publish = false

[dependencies]
agg-gui = { path = "../agg-gui" }
# Decodes image needles loaded by file name (`image_source.rs`); the same
# version and features agg-gui already builds, so nothing new is compiled.
image = "0.24"
# The `stack-dump` feature's minidump reader and walker (rust-minidump, MIT):
# the walker unwinds with each module's CFI (`debuginfo-unwind`: framehop and
# object, pure Rust) and names frames in-process through `backtrace` (gimli
# and addr2line, pure Rust); the processor's default `disasm_amd64` is left
# out. `async-trait` implements the processor's async `SymbolProvider`.
minidump = { version = "0.27", optional = true }
minidump-processor = { version = "0.27", default-features = false, optional = true }
minidump-unwind = { version = "0.27", features = ["debuginfo-unwind"], optional = true }
async-trait = { version = "0.1", optional = true }
backtrace = { version = "0.3", optional = true }
# The `live` feature's real window (`LiveDriver` over `ShellSession`): winit
# and wgpu through the shell, which core agg-gui must not depend on.
agg-gui-shell = { path = "../agg-gui-shell", optional = true }

# The minidump writer (MIT; pure Rust over mach2 on macOS and ptrace on
# Linux) and the `libc` FFI bindings (no compiled C) for thread ids, fork and
# Yama's PR_SET_PTRACER. Windows has no writer yet (docs/design/gui-automation.md).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
minidump-writer = { version = "0.13", optional = true }
libc = { version = "0.2", optional = true }

[features]
# ThreadStackDump (`src/thread_stack_dump/`): the all-thread stack capture,
# a minidump of this process written and walked into a text report.
stack-dump = [
    "dep:minidump",
    "dep:minidump-processor",
    "dep:minidump-unwind",
    "dep:async-trait",
    "dep:backtrace",
    "dep:minidump-writer",
    "dep:libc",
]

# The live window driver (`src/driver/live.rs`): `LiveDriver` over
# `agg_gui_shell::ShellSession`, a real window pumped by the test.
live = ["dep:agg-gui-shell"]

# The controllable dump writer `thread_stack_dump_tests` runs in place of a
# real one (a writer that floods its output, never exits, or fails).
[[bin]]
name = "agg-gui-fake-dump-writer"
path = "tests/support/fake_dump_writer.rs"
required-features = ["stack-dump"]
test = false
doc = false

[[test]]
name = "thread_stack_dump_tests"
path = "tests/thread_stack_dump_tests.rs"
required-features = ["stack-dump"]

# Live-window tests: one real window per process, its event loop on the main
# thread (winit on macOS requires it), so each is a `harness = false` binary
# with its own `main`.
[[test]]
name = "automation_runner_live_tests"
path = "tests/live/automation_runner_live_tests.rs"
harness = false
required-features = ["live"]
