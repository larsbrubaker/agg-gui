# agg-gui-files: the folder and item model of agg-gui's file browser, with no
# drawing code. Folders list folders and items, items say what they are
# (content, a stream of bytes, a link to another folder), a folder the user
# can change adds, removes, renames and moves, searches and sorts behave the
# same everywhere, and changes can be recorded for undo. No agg-gui, agg-rust
# or wgpu dependency, so a model crate with no UI (a server, a website build)
# can depend on it; it builds for wasm32-unknown-unknown.
#
# The model comes from mattercad-rust's mattercad-model (`src/library/`, same
# author), published here under agg-gui's MIT licence.
[package]
name = "agg-gui-files"
version = "0.0.3"
edition = "2021"
# Matches the rest of the agg-gui workspace.
rust-version = "1.88"
license = "MIT"
description = "The folder and item model of agg-gui's file browser: folders, items, writable folders, search, sort and recorded changes, with no drawing code."
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
repository = "https://github.com/larsbrubaker/agg-gui"
readme = "README.md"
keywords = ["agg-gui", "file-browser", "folders", "library"]
categories = ["gui", "filesystem"]

[lib]
name = "agg_gui_files"
path = "src/lib.rs"

[dependencies]
# The search walk's deadline reads the clock, and std's Instant panics in the browser
# (wasm32-unknown-unknown); web-time is std's own Instant natively.
web-time = "1"

[features]
# Folders on the computer's disk (`disk`): listing, writes and the system trash. The trash needs
# the operating system's own calls: NSFileManager through objc2 on macOS (MIT), the Shell's
# recycle bin through windows-sys on Windows (MIT OR Apache-2.0); the freedesktop trash is plain
# file work. Neither compiles C. On wasm32 the disk code compiles and every read fails.
disk = ["dep:objc2-foundation", "dep:windows-sys"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSString", "NSURL", "NSError", "NSFileManager"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

