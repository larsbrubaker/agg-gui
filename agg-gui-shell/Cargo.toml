[package]
name = "agg-gui-shell"
version = "0.9.0"
edition = "2021"
# agg-rust (a path dependency) requires 1.88; wgpu 29 needs 1.87 and arboard 3.6 needs 1.71.
rust-version = "1.88"
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
license = "MIT"
description = "Turn-key native shell for agg-gui — winit event loop, wgpu present, input forwarding, window-bounds persistence, and device-loss recovery"
repository = "https://github.com/larsbrubaker/agg-gui"
homepage = "https://larsbrubaker.github.io/agg-gui/"
documentation = "https://docs.rs/agg-gui-shell"
readme = "README.md"
keywords = ["gui", "winit", "wgpu", "shell", "window"]
categories = ["gui", "graphics", "rendering"]

[features]
# Forwards to agg-gui's `reflect` feature (and agg-gui-wgpu's forward of the
# same) so a consumer that turns default features off can re-enable reflection
# through one knob and still get a single, consistently-featured agg-gui in the
# dependency graph.
reflect = ["agg-gui/reflect", "agg-gui-wgpu/reflect"]

[dependencies]
# `version` is required for a `path` dependency to be publishable.
# `winit-adapter` is the point of this crate: the winit -> agg-gui input
# mapping. The rest of agg-gui's default features (reflect, clipboard) are the
# consumer's choice, so they are off here.
agg-gui = { path = "../agg-gui", version = "0.7.0", default-features = false, features = [
    "winit-adapter",
] }
agg-gui-wgpu = { path = "../agg-gui-wgpu", version = "0.9.0", default-features = false }
winit = "0.30"
wgpu = { version = "29", default-features = false, features = ["wgsl"] }
# Facade only — a library must not print. Binaries choose a logger (or none,
# in which case every call compiles down to a branch on a static).
log = "0.4"

# The Windows desktop settings the shell honours go through agg-os, the
# workspace's one crate with unsafe code (its rule: agg-os/src/lib.rs):
# the tooltip hover time (`tooltip.rs`), the double-click time and rectangle
# (`click_policy.rs`), the live cursor position for the file-drop position
# workaround (`input.rs`; winit's OLE drop path discards the drop point), and
# the font smoothing settings, remote session and primary display rotation
# (`lcd_display.rs`). agg-os builds them on windows-sys 0.52, the version
# winit 0.30 already pulls in, so no second copy is linked. `version` is
# required for a `path` dependency to be publishable.
[target.'cfg(windows)'.dependencies]
agg-os = { path = "../agg-os", version = "0.1.0", features = ["desktop-settings"] }

# On macOS the Objective-C runtime code goes through agg-os too: the native
# menu bar's delegate and action target (`menu_bar/macos.rs`, feature
# `app-menu`) and the `application:openFiles:` hook (`open_files/macos.rs`,
# feature `open-files`).
#
# The rest of the native menu bar (`menu_bar/macos.rs`: filling the menus,
# making the bar the main menu, reading it back) and the double-click interval
# (`click_policy.rs`, `NSEvent.doubleClickInterval`) talk to AppKit through
# objc2's safe bindings, the same binding winit and wgpu already use on the
# mac. objc2 and objc2-foundation: MIT; objc2-app-kit: Zlib OR Apache-2.0 OR MIT.
[target.'cfg(target_os = "macos")'.dependencies]
agg-os = { path = "../agg-os", version = "0.1.0", features = ["open-files", "app-menu"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSProcessInfo",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSCell",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
] }

# Decodes the PNGs the screenshot tests write (`screenshot.rs`); the same
# `png` agg-gui encodes them with.
[dev-dependencies]
png = "0.17"

# No unsafe code in this crate: the compiler refuses it. The workspace's
# rule on unsafe is in agg-os (its src/lib.rs).
[lints.rust]
unsafe_code = "forbid"
