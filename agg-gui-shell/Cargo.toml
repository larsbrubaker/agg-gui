[package]
name = "agg-gui-shell"
version = "0.5.2"
edition = "2021"
# agg-rust (a path dependency) requires 1.88; wgpu 29 needs 1.87 and arboard 3.6 needs 1.71.
rust-version = "1.88"
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
license = "MIT"
description = "Turn-key native shell for agg-gui — winit event loop, wgpu present, input forwarding, window-bounds persistence, and device-loss recovery"
repository = "https://github.com/larsbrubaker/agg-gui"
homepage = "https://larsbrubaker.github.io/agg-gui/"
documentation = "https://docs.rs/agg-gui-shell"
readme = "README.md"
keywords = ["gui", "winit", "wgpu", "shell", "window"]
categories = ["gui", "graphics", "rendering"]

[features]
# Forwards to agg-gui's `reflect` feature (and agg-gui-wgpu's forward of the
# same) so a consumer that turns default features off can re-enable reflection
# through one knob and still get a single, consistently-featured agg-gui in the
# dependency graph.
reflect = ["agg-gui/reflect", "agg-gui-wgpu/reflect"]

[dependencies]
# `version` is required for a `path` dependency to be publishable.
# `winit-adapter` is the point of this crate: the winit -> agg-gui input
# mapping. The rest of agg-gui's default features (reflect, clipboard) are the
# consumer's choice, so they are off here.
agg-gui = { path = "../agg-gui", version = "0.5.1", default-features = false, features = [
    "winit-adapter",
] }
agg-gui-wgpu = { path = "../agg-gui-wgpu", version = "0.5.3", default-features = false }
winit = "0.30"
wgpu = { version = "29", default-features = false, features = ["wgsl"] }
# Facade only — a library must not print. Binaries choose a logger (or none,
# in which case every call compiles down to a branch on a static).
log = "0.4"

# Reuse the same windows-sys major winit 0.30 already pulls in (0.52) so no
# second copy is linked. `Win32_UI_WindowsAndMessaging` carries
# SystemParametersInfoW(SPI_GETMOUSEHOVERTIME) for OS tooltip hover timing and
# GetCursorPos for the file-drop position workaround (winit's OLE drop path
# discards the drop point); `Win32_Foundation` is POINT for the latter. The
# LCD display reader (`lcd_display.rs`) reads the font smoothing settings and
# SM_REMOTESESSION from `Win32_UI_WindowsAndMessaging` and the primary display's
# rotation through `Win32_Graphics_Gdi`'s EnumDisplaySettingsW. The click
# policy (`click_policy.rs`) reads GetDoubleClickTime from
# `Win32_UI_Input_KeyboardAndMouse` and SM_CXDOUBLECLK/SM_CYDOUBLECLK through
# GetSystemMetrics.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# The native menu bar (`menu_bar/macos.rs`) and the double-click interval
# (`click_policy.rs`, `NSEvent.doubleClickInterval`) talk to AppKit through
# objc2, the same binding winit and wgpu already use on the mac. objc2 and objc2-foundation:
# MIT; objc2-app-kit: Zlib OR Apache-2.0 OR MIT.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSProcessInfo",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSCell",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
] }

# Decodes the PNGs the screenshot tests write (`screenshot.rs`); the same
# `png` agg-gui encodes them with.
[dev-dependencies]
png = "0.17"
