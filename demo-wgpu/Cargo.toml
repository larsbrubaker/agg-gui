[package]
name = "demo-wgpu"
version = "0.1.0"
edition = "2021"
description = "Platform shells (winit / browser canvas) and wgpu demo widgets on top of the agg-gui-wgpu renderer"
publish = false

[features]
default = ["reflect"]
# Forwards to agg-gui's `reflect` feature so the live inspector edit-queue
# plumbing in `render_app_frame` is wired up. agg-gui-wgpu takes agg-gui with
# default features off, so name its forward too — that keeps the feature
# request explicit rather than relying on this crate's own agg-gui dep to
# unify it in.
reflect = ["agg-gui/reflect", "agg-gui-wgpu/reflect"]

[dependencies]
agg-gui  = { path = "../agg-gui" }
agg-gui-wgpu = { path = "../agg-gui-wgpu" }
agg-rust = "1.1.0"
bytemuck = { version = "1", features = ["derive"] }
web-time = "1"
# wgsl is enabled by default in wgpu; native backends are enabled per target below.
wgpu = { version = "29", default-features = false, features = ["wgsl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.wgpu]
version = "29"
features = ["vulkan", "dx12", "metal"]

# native_shell â€” turn-key winit event loop + wgpu present for native shims.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agg-gui = { path = "../agg-gui", features = ["winit-adapter"] }
agg-gui-shell = { path = "../agg-gui-shell" }
pollster = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.wgpu]
version = "29"
features = ["webgl"]

# web_shell â€” turn-key canvas + rAF loop + DOM input for wasm shims.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3.82", features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CssStyleDeclaration",
    "DomRect",
    "Event",
    "EventTarget",
    "Location",
    "PointerEvent",
    "MouseEvent",
    "WheelEvent",
    "Navigator",
    "MediaQueryList",
    # Device-tilt input (agg_gui::tilt plumbing)
    "DeviceOrientationEvent",
    "Screen",
    "ScreenOrientation",
    # Gamepad polling (agg_gui::gamepad plumbing)
    "Gamepad",
    "GamepadButton",
] }
