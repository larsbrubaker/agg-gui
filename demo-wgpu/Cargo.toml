[package]
name = "demo-wgpu"
version = "0.1.0"
edition = "2021"
description = "Shared WgpuGfxCtx â€” DrawCtx implementation via wgpu (native Vulkan/DX12/Metal + WebGL2/WebGPU)"

[features]
default = ["reflect"]
# Forwards to agg-gui's `reflect` feature so the live inspector edit-queue
# plumbing in `render_app_frame` is wired up.
reflect = ["agg-gui/reflect"]

[dependencies]
agg-gui  = { path = "../agg-gui" }
agg-rust = "1.1.0"
bytemuck = { version = "1", features = ["derive"] }
web-time = "1"
# wgsl is enabled by default in wgpu; native backends are enabled per target below.
wgpu = { version = "29", default-features = false, features = ["wgsl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.wgpu]
version = "29"
features = ["vulkan", "dx12", "metal"]

# native_shell â€” turn-key winit event loop + wgpu present for native shims.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
agg-gui = { path = "../agg-gui", features = ["winit-adapter"] }
winit = "0.30"
pollster = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.wgpu]
version = "29"
features = ["webgl"]

# web_shell â€” turn-key canvas + rAF loop + DOM input for wasm shims.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3.82", features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CssStyleDeclaration",
    "DomRect",
    "Event",
    "EventTarget",
    "Location",
    "PointerEvent",
    "MouseEvent",
    "WheelEvent",
    "Navigator",
    "MediaQueryList",
] }
