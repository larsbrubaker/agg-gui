# agg-os: the operating system calls and the other unsafe code of the agg-gui
# workspace's crates, each behind a safe function or type. It holds the
# workspace's unsafe code; a member whose manifest sets
# `unsafe_code = "forbid"` cannot contain any, and tests/unsafe_placement.rs
# checks that every member does so except the ones it lists by name, which
# still call the operating system directly (the rule: src/lib.rs).
#
# Each area is a Cargo feature, off by default, so a consumer compiles only
# the bindings it uses. No dependency on any other workspace crate, and no
# build script.
[package]
name = "agg-os"
version = "0.1.0"
edition = "2021"
# Matches the rest of the agg-gui workspace.
rust-version = "1.88"
license = "MIT"
description = "The operating system calls and other unsafe code of the agg-gui crates, each behind a safe function and a Cargo feature."
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
repository = "https://github.com/larsbrubaker/agg-gui"
readme = "README.md"
keywords = ["agg-gui", "os", "ffi", "safe-wrapper"]
categories = ["os", "api-bindings"]

[lib]
name = "agg_os"
path = "src/lib.rs"

[features]
# `alloc_count`: a global allocator that forwards to the system allocator and
# counts allocations, for benches that report allocations per pass.
counting-alloc = []
# `thread_id`: the calling thread's id as the operating system knows it, which
# a stack dump records (libc on macOS and Linux).
thread-id = ["dep:libc"]
# `windows::desktop_settings`: reads of the Windows desktop's settings for
# agg-gui-shell (tooltip hover time, double-click time and rectangle, the
# cursor position, font smoothing, remote session, display rotation).
desktop-settings = ["dep:windows-sys-052"]
# `windows::recycle_bin`: moving an item to the Windows Recycle Bin, a path's
# long form and the bin's item count, for agg-gui-files' trash.
recycle-bin = ["dep:windows-sys-061"]
# `macos::open_files`: makes the application delegate answer
# `application:openFiles:`, for agg-gui-shell's OS-delivered open requests.
open-files = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "objc2-foundation/std",
    "objc2-foundation/NSArray",
    "objc2-foundation/NSEnumerator",
    "objc2-foundation/NSString",
    "objc2-app-kit/std",
    "objc2-app-kit/NSApplication",
    "objc2-app-kit/NSResponder",
]
# `macos::menu`: the Objective-C delegate and action target of agg-gui-shell's
# native menu bar, calling back into a handler the shell implements.
app-menu = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "objc2-foundation/std",
    "objc2-foundation/NSString",
    "objc2-app-kit/std",
    "objc2-app-kit/NSEvent",
    "objc2-app-kit/NSMenu",
    "objc2-app-kit/NSMenuItem",
]

# The `libc` FFI bindings (MIT OR Apache-2.0, no compiled C).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = { version = "0.2", optional = true }

# The `windows-sys` FFI bindings (MIT OR Apache-2.0, no compiled C), in two
# versions so that each consumer builds the one it built before: agg-gui-shell
# uses 0.52 because winit 0.30 already builds it, and agg-gui-files uses 0.61.
# Each is enabled by its feature only, with only the bindings its module uses.
[target.'cfg(windows)'.dependencies]
# `desktop-settings`: POINT; EnumDisplaySettingsW and DEVMODEW;
# GetDoubleClickTime; GetCursorPos, GetSystemMetrics, SystemParametersInfoW.
windows-sys-052 = { package = "windows-sys", version = "0.52", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# `recycle-bin`: S_OK; GetLongPathNameW; SHFileOperationW, SHQueryRecycleBinW.
windows-sys-061 = { package = "windows-sys", version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }

# The objc2 bindings (objc2 and objc2-foundation: MIT; objc2-app-kit: Zlib OR
# Apache-2.0 OR MIT; no compiled C), the versions winit 0.30 and wgpu already
# build on the mac. Enabled by the macOS features only; each feature turns on
# the binding features its module uses (in `[features]` above), so one does
# not build the other's.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false }
objc2-app-kit = { version = "0.3", optional = true, default-features = false }

# The real-menu test (`tests/macos_menu.rs`) also makes the application, a key
# event (whose constructor names NSGraphicsContext) and a point.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSGeometry",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSEvent",
    "NSGraphicsContext",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
] }

# AppKit objects are main-thread only, and the test harness runs tests on
# other threads: this test is its own `main`, run on the main thread.
[[test]]
name = "macos_menu"
harness = false
required-features = ["app-menu"]

# The unsafe code here is held to account: an unsafe fn's body is not one
# implicit unsafe block, and every unsafe block says why it is sound.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
