# agg-os: the operating system calls and the other unsafe code of the agg-gui
# workspace's crates, each behind a safe function or type. It holds the
# workspace's unsafe code; every other member's manifest sets
# `unsafe_code = "forbid"`, so it cannot contain any, and
# tests/unsafe_placement.rs checks that every member but this one does so
# (the rule: src/lib.rs).
#
# Each area is a Cargo feature, off by default, so a consumer compiles only
# the bindings it uses. No dependency on any other workspace crate, and no
# build script.
[package]
name = "agg-os"
version = "0.1.0"
edition = "2021"
# Matches the rest of the agg-gui workspace.
rust-version = "1.88"
license = "MIT"
description = "The operating system calls and other unsafe code of the agg-gui crates, each behind a safe function and a Cargo feature."
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
repository = "https://github.com/larsbrubaker/agg-gui"
readme = "README.md"
keywords = ["agg-gui", "os", "ffi", "safe-wrapper"]
categories = ["os", "api-bindings"]

[lib]
name = "agg_os"
path = "src/lib.rs"

[features]
# `alloc_count`: a global allocator that forwards to the system allocator and
# counts allocations, for benches that report allocations per pass.
counting-alloc = []
# `thread_id`: the calling thread's id as the operating system knows it, which
# a stack dump records (libc on macOS and Linux).
thread-id = ["dep:libc"]
# `windows::desktop_settings`: reads of the Windows desktop's settings for
# agg-gui-shell (tooltip hover time, double-click time and rectangle, the
# cursor position, font smoothing, remote session, display rotation).
desktop-settings = ["dep:windows-sys-052"]
# `windows::recycle_bin`: moving an item to the Windows Recycle Bin, a path's
# long form and the bin's item count, for agg-gui-files' trash.
recycle-bin = ["dep:windows-sys-061"]
# `macos::open_files`: makes the application delegate answer
# `application:openFiles:`, for agg-gui-shell's OS-delivered open requests.
open-files = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "objc2-foundation/std",
    "objc2-foundation/NSArray",
    "objc2-foundation/NSEnumerator",
    "objc2-foundation/NSString",
    "objc2-app-kit/std",
    "objc2-app-kit/NSApplication",
    "objc2-app-kit/NSResponder",
]
# `macos::menu`: the Objective-C delegate and action target of agg-gui-shell's
# native menu bar, calling back into a handler the shell implements.
app-menu = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "objc2-foundation/std",
    "objc2-foundation/NSString",
    "objc2-app-kit/std",
    "objc2-app-kit/NSEvent",
    "objc2-app-kit/NSMenu",
    "objc2-app-kit/NSMenuItem",
]
# `windows::audio_capture`: agg-mic's Windows capture, WASAPI through
# Microsoft's `windows` bindings (the COM, WASAPI and PROPVARIANT APIs its
# calls name).
#
# `macos::audio_input`: agg-mic's macOS capture, an AVAudioEngine whose input
# feeds an AVAudioSinkNode, the microphone permission and the default input
# device. No AppKit: AVFoundation's AVCaptureDevice (and AVMediaFormat's
# media type), AVFAudio's engine and nodes (and the CoreAudio buffer types
# the sink node's receiver block takes), Foundation's notification center
# (NSNotification, NSOperation: the observer of the engine's configuration
# changes), and block2 for the blocks.
microphone = [
    "dep:windows-062",
    "dep:objc2",
    "dep:block2",
    "dep:objc2-foundation",
    "dep:objc2-av-foundation",
    "dep:objc2-avf-audio",
    "dep:objc2-core-audio-types",
    "objc2-foundation/std",
    "objc2-foundation/block2",
    "objc2-foundation/NSString",
    "objc2-foundation/NSError",
    "objc2-foundation/NSObject",
    "objc2-foundation/NSNotification",
    "objc2-foundation/NSOperation",
    "objc2-av-foundation/std",
    "objc2-av-foundation/block2",
    "objc2-av-foundation/AVCaptureDevice",
    "objc2-av-foundation/AVMediaFormat",
    "objc2-avf-audio/std",
    "objc2-avf-audio/block2",
    "objc2-avf-audio/objc2-core-audio-types",
    "objc2-avf-audio/AVAudioEngine",
    "objc2-avf-audio/AVAudioFormat",
    "objc2-avf-audio/AVAudioIONode",
    "objc2-avf-audio/AVAudioNode",
    "objc2-avf-audio/AVAudioSinkNode",
    "objc2-avf-audio/AVAudioTypes",
    "objc2-core-audio-types/std",
    "objc2-core-audio-types/CoreAudioBaseTypes",
]
# `linux::fork_minidump`: a minidump of this process written by a forked
# child that ptraces it, for agg-gui-automation's all-thread stack dump on
# Linux (libc for fork, PR_SET_PTRACER and waitpid; minidump-writer for the
# child's dump).
fork-minidump = ["dep:libc", "dep:minidump-writer"]

# The `libc` FFI bindings (MIT OR Apache-2.0, no compiled C).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = { version = "0.2", optional = true }

# The minidump writer (rust-minidump's minidump-writer, MIT; pure Rust over
# ptrace and /proc on Linux), the version agg-gui-automation builds: the
# `fork-minidump` child runs it, so it is called from here, where the
# argument for what that child may do lives.
[target.'cfg(target_os = "linux")'.dependencies]
minidump-writer = { version = "0.13", optional = true }

# The `windows-sys` FFI bindings (MIT OR Apache-2.0, no compiled C), in two
# versions so that each consumer builds the one it built before: agg-gui-shell
# uses 0.52 because winit 0.30 already builds it, and agg-gui-files uses 0.61.
# Each is enabled by its feature only, with only the bindings its module uses;
# so is the `windows` crate below, for agg-mic.
[target.'cfg(windows)'.dependencies]
# `desktop-settings`: POINT; EnumDisplaySettingsW and DEVMODEW;
# GetDoubleClickTime; GetCursorPos, GetSystemMetrics, SystemParametersInfoW.
windows-sys-052 = { package = "windows-sys", version = "0.52", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# `recycle-bin`: S_OK; GetLongPathNameW; SHFileOperationW, SHQueryRecycleBinW.
windows-sys-061 = { package = "windows-sys", version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }
# `microphone`: Microsoft's pure-Rust `windows` bindings (MIT OR Apache-2.0;
# raw-dylib linking through windows-link, no build script), the binding and
# version agg-mic's WASAPI capture has always used, carried over with the
# capture so agg-mic builds no binding it did not build before: its COM
# interfaces come with reference counting and `Result`s, and it was already
# in agg-gui's build through wgpu. Only the COM and audio APIs the capture
# calls (Activate's PROPVARIANT parameter needs StructuredStorage and Variant).
windows-062 = { package = "windows", version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

# The objc2 bindings (objc2, block2 and objc2-foundation: MIT; objc2-app-kit,
# objc2-av-foundation, objc2-avf-audio and objc2-core-audio-types: Zlib OR
# Apache-2.0 OR MIT; no compiled C), the versions winit 0.30 and wgpu already
# build on the mac (the audio ones: the versions agg-mic built). Enabled by
# the macOS features only; each feature turns on the binding features its
# module uses (in `[features]` above), so one does not build the other's:
# `microphone` builds no AppKit, `open-files` and `app-menu` no audio.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false }
objc2-app-kit = { version = "0.3", optional = true, default-features = false }
objc2-av-foundation = { version = "0.3", optional = true, default-features = false }
objc2-avf-audio = { version = "0.3", optional = true, default-features = false }
objc2-core-audio-types = { version = "0.3", optional = true, default-features = false }

# The real-menu test (`tests/macos_menu.rs`) also makes the application, a key
# event (whose constructor names NSGraphicsContext) and a point.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSGeometry",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSEvent",
    "NSGraphicsContext",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
] }

# AppKit objects are main-thread only, and the test harness runs tests on
# other threads: this test is its own `main`, run on the main thread.
[[test]]
name = "macos_menu"
harness = false
required-features = ["app-menu"]

# The unsafe code here is held to account: an unsafe fn's body is not one
# implicit unsafe block, and every unsafe block says why it is sound.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
