# agg-mic: the system microphone in pure Rust, for agg-gui's dictation
# (agg-gui-whistle), MatterCAD's voice input and whistle-rust's desktop demo.
# It opens the default input device and hands its audio on as mono f32 chunks
# with their sample rate while it records; converting the rate, keeping a file
# and drawing a meter are each consumer's own business. No agg-gui, wgpu or UI.
#
# Every platform's capture is pure Rust with no build script and no `-sys`
# crate: AVFoundation's AVAudioEngine on macOS (objc2, through agg-os's
# `microphone` feature, where its unsafe code lives), WASAPI on Windows
# (Microsoft's `windows` bindings, raw-dylib linking, through the same agg-os
# feature), and the PulseAudio
# native protocol on Linux (spoken by PulseAudio and PipeWire's pulse server,
# so no libpulse or ALSA). Anywhere else, wasm32 included, it builds and
# reports that there is no microphone.
#
# The recorders come from mattercad-rust's mattercad-ai (`src/audio/`, same
# author, MIT), where they were first written for MatterCAD's AI chat.
[package]
name = "agg-mic"
version = "0.1.0"
edition = "2021"
# `<[T]>::as_chunks` (pulse_frames) is stable from 1.88, which agg-gui needs too.
rust-version = "1.88"
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
license = "MIT"
description = "The system microphone in pure Rust: mono f32 chunks from the default input device on macOS, Windows and Linux"
repository = "https://github.com/larsbrubaker/agg-gui"
readme = "README.md"
publish = false

# The macOS capture (`mac_capture`, `mac_engine_change`): AVFoundation's
# permission and default device, and an AVAudioEngine whose input feeds an
# AVAudioSinkNode (the input's audio at I/O-buffer granularity, so a stop
# loses ~10 ms, not a tap's ~85 ms buffer), observed for configuration
# changes, which report a lost device. The Objective-C calls are agg-os's
# `microphone` feature (`agg_os::macos::audio_input`), the workspace's crate
# for unsafe code, over the objc2 pure-Rust bindings with no build script
# (only the classes the capture uses; objc2 and block2 are already in
# agg-gui's build through winit). agg-os is MIT, same author; its objc2 crates
# are MIT or Zlib OR Apache-2.0 OR MIT. A path dependency, since agg-mic is
# not published; the path is relative to this crate, so a consumer outside
# the workspace builds it too.
[target.'cfg(target_os = "macos")'.dependencies]
agg-os = { path = "../agg-os", features = ["microphone"] }

# The Windows capture (`windows_capture`): WASAPI through Microsoft's
# pure-Rust `windows` bindings 0.62 (raw-dylib linking through windows-link,
# no build script), only the COM and audio APIs it calls. The calls are
# agg-os's `microphone` feature (`agg_os::windows::audio_capture`), which
# builds that binding; agg-mic names no `windows` type. Already in agg-gui's
# build through wgpu. MIT OR Apache-2.0.
[target.'cfg(target_os = "windows")'.dependencies]
agg-os = { path = "../agg-os", features = ["microphone"] }

# The Linux capture (`linux`): the PulseAudio native protocol in pure Rust, no
# build script and no libpulse. Its own dependencies (mio, futures, thiserror,
# bitflags, byteorder, enum-primitive-derive, num-traits, log) are MIT,
# Apache-2.0 or Unlicense. MIT.
[target.'cfg(target_os = "linux")'.dependencies]
pulseaudio = "0.3"

# No unsafe code in this crate: the compiler refuses it. The workspace's
# rule on unsafe is in agg-os (its src/lib.rs).
[lints.rust]
unsafe_code = "forbid"
